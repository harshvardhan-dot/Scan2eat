services:
  - type: web
    name: scan2eat-backend
    env: node
    region: singapore
    plan: free
    rootDir: apps/server
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
